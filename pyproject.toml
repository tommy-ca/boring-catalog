[project]
name = "boringcatalog"
version = "0.4.0"
description = "A DuckDB-based Iceberg catalog implementation"
readme = "README.md"
authors = [
    { name = "huraultj", email = "julien.hurault@sumeo.io" }
]
requires-python = ">=3.10"
dependencies = [
    "s3fs>=2023.12.0",
    "pyiceberg>=0.9.0",
    "click>=8.0.0",
    "duckdb>=0.9.0",
    "pyiceberg[pyarrow]>=0.9.0",
    "slatedb>=0.8.1"
]
urls = {Homepage = "https://github.com/boringdata/boring-catalog"}

[project.scripts]
ice = "boringcatalog.cli:cli"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0"
]
dev = [
    "pytest>=7.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "ruff>=0.6.9"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
